{% extends "base.html" %}
{% block content %}
<div class="hero-banner d-flex align-items-center justify-content-between p-4">
  <div class="hero-text">
    <h2>Qualitron Laptops - Corporate Offers</h2>
    <p>Exclusive corporate discount, trade-ins and finance options.</p>
    <a href="{{ url_for('shop') }}" class="btn btn-dark">Shop Now</a>
  </div>
  <div>
    <img src="{{ url_for('static', filename='images/slide1.jpg') }}" class="hero-img" alt="Hero">
  </div>
</div>

<h3 class="mt-4">Featured Products</h3>
<div class="row g-3 mt-2">
  {% for p in featured %}
  <div class="col-6 col-md-4 col-lg-3">
    <div class="product-card p-3">
      <img src="{{ url_for('static', filename='images/' ~ p.image) }}" alt="{{ p.Product }}" style="width:100%;height:140px;object-fit:contain;">
      <h5 class="mt-2">{{ p.Company }} {{ p.Product }}</h5>
      <p class="price">₹ {{ p.price_inr }}</p>
      <button class="buy-now-btn btn btn-dark w-100"
        data-id="{{ p.id }}"
        data-name="{{ p.Company }} {{ p.Product }}"
        data-price="{{ p.price_inr }}"
        data-image="{{ url_for('static', filename='images/' ~ p.image) }}">
        Buy Now
      </button>
    </div>
  </div>
  {% endfor %}
</div>
<script>
document.querySelectorAll('.buy-now-btn').forEach(button => {
  button.addEventListener('click', function() {
    const id = this.dataset.id;
    const name = this.dataset.name;
    const price = parseInt(this.dataset.price);
    const image = this.dataset.image;
    
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    // Check if item already exists
    let existing = cart.find(item => item.id === id);
    if (existing) {
      existing.quantity++;
    } else {
      cart.push({ id, name, price, quantity: 1, image });
    }

    // Save updated cart
    localStorage.setItem("cart", JSON.stringify(cart));

    // Redirect to cart
    window.location.href = "{{ url_for('cart') }}";
  });
});
</script>
{% endblock %}
